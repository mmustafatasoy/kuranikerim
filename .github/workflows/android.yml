name: Android Debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android 36
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Quran data
        run: python3 scripts/validate_data.py
      - name: Verify verse-by-verse QuranEnc meal
        run: python3 scripts/check_quranenc_meal.py
      - name: Build debug APK
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify bundled offline Quran audio
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          COUNT="$(unzip -Z1 "$APK" | grep -Ec '^assets/quran_audio/alafasy/[0-9]+\.mp3        if: success()
        with:
          name: nur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
)"
          echo "Bundled offline ayah audio clips: $COUNT"
          test "$COUNT" -eq 22
          unzip -Z1 "$APK" | grep -q '^assets/quran_audio/alafasy/1\.mp3        if: success()
        with:
          name: nur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

          unzip -Z1 "$APK" | grep -q '^assets/quran_audio/alafasy/6236\.mp3        if: success()
        with:
          name: nur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
