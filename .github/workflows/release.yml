name: NUR Signed GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure tag equals app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Require release signing secrets
        shell: bash
        env:
          KEY_B64: ${{ secrets.NUR_RELEASE_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.NUR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUR_KEY_ALIAS }}
          ALIAS_PASSWORD: ${{ secrets.NUR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" || { echo "::error::Set secret NUR_RELEASE_KEYSTORE_B64"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Set secret NUR_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Set secret NUR_KEY_ALIAS"; exit 1; }
          test -n "$ALIAS_PASSWORD" || { echo "::error::Set secret NUR_KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/nur-release.jks"
          test -s "$RUNNER_TEMP/nur-release.jks"
          echo "NUR_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/nur-release.jks" >> "$GITHUB_ENV"

      - name: Verify Quran and meal data
        run: |
          python3 scripts/validate_data.py
          python3 scripts/check_quranenc_meal.py

      - name: Build signed release and test
        env:
          NUR_KEYSTORE_PASSWORD: ${{ secrets.NUR_KEYSTORE_PASSWORD }}
          NUR_KEY_ALIAS: ${{ secrets.NUR_KEY_ALIAS }}
          NUR_KEY_PASSWORD: ${{ secrets.NUR_KEY_PASSWORD }}
        run: bash gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify signed APK and bundled Quran audio
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          COUNT="$(unzip -Z1 "$APK" | grep -Ec '^assets/quran_audio/alafasy/[0-9]+\.mp3$')"
          test "$COUNT" -eq 22
          cp "$APK" "$RUNNER_TEMP/nur-release.apk"
          cd "$RUNNER_TEMP"
          sha256sum nur-release.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/nur-release.apk#NUR signed Android APK" \
            "$RUNNER_TEMP/SHA256SUMS.txt#SHA256 checksum" \
            --title "NUR $GITHUB_REF_NAME" \
            --notes "NUR Kur'an-ı Kerim ve İbadet Rehberi güncellemesi. Android 8.0+. Kalıcı yayın anahtarıyla imzalanmıştır." \
            --verify-tag
